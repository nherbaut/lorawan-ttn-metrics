name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for `git describe` (image version)

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Image coordinates
        id: img
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REPOSITORY#*/}" | tr 'A-Z' 'a-z' >> "$GITHUB_OUTPUT"

      - name: Multi-arch build (pull request, not pushed)
        if: github.event_name == 'pull_request'
        run: make multiarch OWNER=${{ steps.img.outputs.owner }} IMAGE_NAME=${{ steps.img.outputs.name }} EXTRA_TAGS=

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 + linux/arm64
        if: github.event_name != 'pull_request'
        run: make push OWNER=${{ steps.img.outputs.owner }} IMAGE_NAME=${{ steps.img.outputs.name }} SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Show manifest
        if: github.event_name != 'pull_request'
        run: make inspect OWNER=${{ steps.img.outputs.owner }} IMAGE_NAME=${{ steps.img.outputs.name }}
